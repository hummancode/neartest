name: mevzuat-check
# Weekly: list regulated rates (KKDF, BSMV, stopaj, card caps...) that are overdue for a check or not
# verified against the official text, and keep one open issue with that list. Nothing is changed
# automatically: a person reads the official source and updates data/params/parametreler.json.
on:
  schedule:
    - cron: "0 7 * * 1"   # Mondays 10:00 Istanbul
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: list parameters needing a check
        id: stale
        run: |
          set +e
          python -m pipeline.params --stale > stale.txt
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: open or update the reminder issue
        if: steps.stale.outputs.code == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Mevzuat kontrolü: doğrulanacak oranlar"
          {
            echo "Aşağıdaki oranlar resmî metinden doğrulanmadı veya kontrol süresi geçti."
            echo "Resmî kaynağı okuyup \`data/params/parametreler.json\` dosyasına yeni bir geçmiş kaydı ekleyin (\`status: verified\`, kaynak bağlantısı, kontrol eden, tarih)."
            echo
            cat stale.txt
          } > body.md
          NUM=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')
          if [ -n "$NUM" ]; then gh issue edit "$NUM" --body-file body.md; else gh issue create --title "$TITLE" --body-file body.md; fi
