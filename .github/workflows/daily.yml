name: daily-data
on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC = 09:00 Istanbul
  workflow_dispatch:

permissions:
  contents: write   # needed to push the data commit

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: pytest -q

      - name: fetch from EVDS
        if: ${{ env.EVDS_API_KEY != '' }}
        run: python -m pipeline.fetch
        continue-on-error: true   # a failing series falls back to manual/sample data, flagged on the site
      - name: no API key
        if: ${{ env.EVDS_API_KEY == '' }}
        run: echo "::warning::EVDS_API_KEY secret yok; yalnızca örnek veri kullanılacak."

      - name: fetch World Bank (country comparison, no key needed)
        run: python -m pipeline.worldbank
        continue-on-error: true

      # Until every series has a verified source, missing ones are filled with flagged sample data.
      - run: python -m pipeline.build --sample

      # Make sure the site still builds with the new data before committing it.
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: site/package-lock.json }
      - run: npm ci
        working-directory: site
      - run: npm test       # TS engine vs. tests/cases.json (same cases as Python)
        working-directory: site
      - run: npm run build
        working-directory: site
      - run: npm run check   # links, anchors, disclaimer, sample banner
        working-directory: site

      - name: commit data if changed
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "site/data değişmedi"
          else
            git commit -m "data: daily update"
            git push
          fi
